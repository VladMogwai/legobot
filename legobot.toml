# Вкусовые решения, которые не вычисляются из фото. Меняй здесь — бот не угадывает.

[mosaic]
outline_black = true              # тёмно-серый контур спрайта класть чёрным (печать на фигурке чёрная)
back_color = "Dark_Bluish_Gray"   # задняя стенка и подпорки стоячей фигурки; "Black" — как у Pixel Pals
palette = "common"                # "common" — только ходовые цвета (проще купить, Studio рисует точно); "all" — вся палитра
